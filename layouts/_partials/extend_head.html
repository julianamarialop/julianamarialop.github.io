{{- /* Tipografia editorial: Fraunces nos titulos, Source Serif 4 no texto corrido,
       Inter na interface. */ -}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..600&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
{{- if and (eq .Kind "page") (eq .Section "articles") }}
<script>
  // Barra de progresso de leitura no topo do artigo.
  addEventListener("DOMContentLoaded", () => {
    const barra = document.querySelector(".progresso span");
    const texto = document.querySelector(".artigo-texto");
    if (!barra || !texto) return;
    const atualizar = () => {
      const r = texto.getBoundingClientRect();
      const total = r.height - innerHeight;
      const lido = Math.min(Math.max(-r.top / (total > 0 ? total : 1), 0), 1);
      barra.style.transform = `scaleX(${lido})`;
    };
    addEventListener("scroll", atualizar, { passive: true });
    addEventListener("resize", atualizar);
    atualizar();
  });
</script>
{{- end }}
