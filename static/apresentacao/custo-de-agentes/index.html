  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

      if (!chavePriv || remoto) return;
      var o = { t: t, m: m, n: Math.max(Date.now(), ultimoN + 1), e: { cache: E.cache, passos: E.passos, resumo: E.resumo, parcela: E.parcela } };
      ultimoN = o.n;
      crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, chavePriv, corpo(o)).then(function (s) { o.s = para64(s); enviar(o); }).catch(function () {});
    }
    function manual() { if (aoVivo()) { seguindo = false; mostrar(); } }

    function conectar() {
      SERVIDORES.forEach(function (url) {
        var c = window.mqtt.connect(url, { clientId: "jml-" + Math.random().toString(16).slice(2, 12), clean: true, reconnectPeriod: 4000, connectTimeout: 8000 });
        clientes.push(c);
        c.on("connect", function () {
          c.subscribe(TOPICO, { qos: 0 });
          if (chavePriv) { if (pendente) enviar(pendente); else if (atual >= 0) publicar(atual, mom); }
          mostrar();
        });
        c.on("message", function (_, carga) { receber(carga.toString()); });
        c.on("close", mostrar);
        c.on("error", function () {});
      });
    }

    function iniciar() {
      if (!window.crypto || !crypto.subtle) return;
      var guardada = null, params = new URLSearchParams(location.search);
      try {
        if (location.hash.indexOf("#k=") === 0) {
          var k = location.hash.slice(3);
          if (k === "sair") localStorage.removeItem("apresentadora"); else localStorage.setItem("apresentadora", k);
        }
        if (!params.has("publico")) guardada = localStorage.getItem("apresentadora");
      } catch (e) {}
      crypto.subtle.importKey("jwk", PUBLICA, { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]).then(function (pub) {
        chavePub = pub;
        if (!guardada) return null;
        var jwk = { kty: "EC", crv: "P-256", x: PUBLICA.x, y: PUBLICA.y, d: guardada };
        return crypto.subtle.importKey("jwk", jwk, { name: "ECDSA", namedCurve: "P-256" }, false, ["sign"]).catch(function () { return null; });
      }).then(function (priv) {
        chavePriv = priv; mostrar();
        var s = document.createElement("script");
        s.src = BIBLIOTECA; s.onload = conectar;
        document.head.appendChild(s);
      }).catch(function () {});
    }
    iniciar();
    return { publicar: publicar, manual: manual, aoVivo: aoVivo, apresentadora: function () { return !!chavePriv; } };
  }

  // ================================================== malha de rede ao fundo
  // Como o globo da capa do livro: pontos ligados por linhas, em movimento lento.
  var mcv = $("malha"), mctx = mcv.getContext("2d"), MW = 0, MH = 0, nos = [];
  function medirMalha() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    MW = window.innerWidth; MH = window.innerHeight;
    mcv.width = Math.round(MW * dpr); mcv.height = Math.round(MH * dpr);
    mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function malha(dt) {
    if (!nos.length) for (var n = 0; n < 40; n++) nos.push({ x: Math.random(), y: Math.random(), vx: (Math.random() - 0.5) * 0.012, vy: (Math.random() - 0.5) * 0.012 });
    var lim = Math.max(80, MW * 0.2);
    mctx.clearRect(0, 0, MW, MH); mctx.lineWidth = 1;
    for (var a = 0; a < nos.length; a++) {
      var p = nos[a]; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.x < 0 || p.x > 1) p.vx *= -1;
      if (p.y < 0 || p.y > 1) p.vy *= -1;
      for (var b = a + 1; b < nos.length; b++) {
        var q = nos[b], d = Math.hypot((p.x - q.x) * MW, (p.y - q.y) * MH);
        if (d < lim) { mctx.strokeStyle = "rgba(53,208,247," + (0.1 * (1 - d / lim)) + ")"; mctx.beginPath(); mctx.moveTo(p.x * MW, p.y * MH); mctx.lineTo(q.x * MW, q.y * MH); mctx.stroke(); }
      }
      mctx.fillStyle = "rgba(120,220,250,.26)"; mctx.beginPath(); mctx.arc(p.x * MW, p.y * MH, 1.4, 0, 6.2832); mctx.fill();
    }
  }

  var ultimo = 0;
  function ciclo(agora) {
    var dt = Math.min(0.05, (agora - ultimo) / 1000 || 0); ultimo = agora;
    malha(dt);
    var tela = telas[atual];
    if (tela && tela.quadro) tela.quadro(agora / 1000, dt);
    requestAnimationFrame(ciclo);
  }

  // Inicio: #3 abre a tela 3; ?m=2 abre no segundo momento (usado na verificacao).
  var hi = parseInt(location.hash.slice(1), 10) || 1;
  sinc = criarSinc();
  var mi = parseInt(new URLSearchParams(location.search).get("m"), 10) || 1;
  medirMalha();
  ir(hi - 1, 1);
  for (var k = 2; k <= mi; k++) ir(atual, k);
  requestAnimationFrame(function (t) { ultimo = t; ciclo(t); });
})();
</script>
