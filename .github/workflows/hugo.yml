# Workflow oficial do Hugo para GitHub Pages (gohugo.io/host-and-deploy/host-on-github-pages).
# Pre-requisito unico: Settings > Pages > Source = "GitHub Actions".
name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Todo dia: a calculadora de custo de agentes mostra precos lidos das fontes
  # dos fornecedores, e um preco so vale com a data em que foi lido.
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
      HUGO_ENVIRONMENT: production
      TZ: America/Sao_Paulo
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      # Motor da calculadora (/agent-cost/): vem do repositorio publico, nunca de
      # uma copia versionada aqui, para a pagina e o `git clone` rodarem o mesmo
      # arquivo. Se o repositorio ou as fontes de preco falharem, o site publica
      # mesmo assim e a pagina diz o que faltou.
      - name: Fetch the agent cost engine
        id: engine
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: julianamarialop/agent-cost-math
          path: _agent-cost-math
      - name: Publish the engine and today's prices
        if: steps.engine.outcome == 'success'
        run: |
          mkdir -p static/agent-cost-math
          cp _agent-cost-math/{agent_cost.py,live_prices.py,architecture.example.json,prices.example.json} static/agent-cost-math/
          cd static/agent-cost-math
          python3 live_prices.py --self-test
          if ! python3 live_prices.py --out prices.live.json; then
            rm -f prices.live.json
            echo "::warning::live prices unavailable; the calculator page will say it uses the hand table"
          fi
      # Registro formal-tecnico no texto publico da calculadora: linguagem
      # coloquial impede a publicacao, com a lista de ocorrencias.
      - name: Check register
        run: python3 tools/check_registro.py
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Hugo
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
